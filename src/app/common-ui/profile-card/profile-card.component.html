<div class="profile-card">
  <div class="profile-card__user">
    <img
      src="/assets/images/avatar_ryan.svg"
      alt="User Avatar"
      class="profile-card__avatar"
    />

    <div class="profile-card__name">
      <strong class="h6">Райан Гослинг</strong>
      <span class="name-subtitle">ryangosling</span>
    </div>
  </div>

  <div class="profile-card__description">
    Список навыков, который мы обсудили выше, — основа резюме,
    но не единственная его часть. Также можно рассказать о себе в классическом
    смысле — этот раздел можно добавить в сопроводительное письмо.
  </div>

  <div class="profile-card__tags">
    @for (tag of tags; track $index) {
      <app-skill-tag [text]="tag" />
    }
  </div>

  <div class="profile-card__action-btns">
    <app-action-button text="Поделиться" />
  </div>
</div>
